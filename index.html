<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Наш Мир 🤍</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS (Карта) -->

    <audio id="bg-music" src="musik.mp3" loop preload="auto"></audio>

        <header class="header">

            </div>

            <h1>Мы вместе уже ✨</h1>
            <div id="timer" class="timer-box">
                <div class="time-unit">
                    <span id="days">0</span>
                    <p class="time-label">Дней</p>
                </div>
                <div class="time-unit">
                    <span id="hours">0</span>
                    <p class="time-label">Часов</p>
                </div>
                <div class="time-unit">
                    <span id="minutes">0</span>
                    <p class="time-label">Минут</p>
                </div>
                <div class="time-unit">
                    <span id="seconds">0</span>
                    <p class="time-label">Секунд</p>
                </div>
            </div>
        </header>

        <!-- Интерактивная Карта Памяти -->
        <section class="map-section">
            <h2>Карта Памятных Мест 📍</h2>
            <p class="map-subtitle">Нажми на метку, чтобы открыть воспоминание ✨</p>
            <div id="map"></div>
        </section>
